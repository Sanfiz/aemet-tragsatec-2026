<script>
document.addEventListener('DOMContentLoaded', function() {
  const current = window.location.pathname.split('/').pop() || 'index.html';

  document.querySelectorAll('#site-nav .nav-link').forEach(link => {
    if (link.getAttribute('href') === current) link.classList.add('active');
  });
  document.querySelectorAll('.nav-dropdown-item').forEach(item => {
    if (item.getAttribute('href') === current) {
      item.classList.add('active');
      const parent = item.closest('.nav-dropdown').querySelector('.nav-link-dropdown');
      if (parent) parent.classList.add('active');
    }
  });

  /* ── Buscador: dispara el modal de Quarto Search ── */
  const trigger = document.getElementById('header-search-trigger');
  if (trigger) {
    trigger.addEventListener('click', function() {
      const quartoBtn = document.querySelector('#quarto-search')
                     || document.querySelector('[aria-label="Search"]')
                     || document.querySelector('.aa-DetachedSearchButton');
      if (quartoBtn) quartoBtn.click();
    });
  }

  /* ── Selector de idioma ── */
  const langTrigger = document.getElementById('header-lang-trigger');
  const langMenu    = document.getElementById('header-lang-menu');

  if (langTrigger && langMenu) {
    langTrigger.addEventListener('click', function(e) {
      e.stopPropagation();
      langMenu.classList.toggle('open');
    });
    document.addEventListener('click', function(e) {
      if (!langMenu.contains(e.target)) langMenu.classList.remove('open');
    });

    /* Cambiar de idioma manteniendo página actual cuando sea posible */
    document.querySelectorAll('.header-lang-option').forEach(opt => {
      opt.addEventListener('click', function(e) {
        e.preventDefault();
        const targetLang = this.dataset.lang;
        const langPath   = this.dataset.path; // '', 'en/' o 'gl/'
        const currentLang = document.getElementById('header-lang').dataset.current;
        if (targetLang === currentLang) {
          langMenu.classList.remove('open');
          return;
        }

        // Obtener el nombre de la página actual (sin la carpeta de idioma)
        const pathParts = window.location.pathname.split('/').filter(Boolean);
        let pageName = pathParts[pathParts.length - 1] || 'index.html';
        if (!pageName.endsWith('.html')) pageName = 'index.html';

        // Construir nueva URL relativa
        // Si estamos en raíz (currentLang='es'), subimos por 0 niveles; en en/ o gl/ subimos por 1
        let newUrl;
        if (currentLang === 'es') {
          newUrl = langPath + pageName;
        } else {
          // estamos en /en/ o /gl/ → subimos un nivel
          newUrl = '../' + langPath + pageName;
        }
        window.location.href = newUrl;
      });
    });
  }
});
</script>
