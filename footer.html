<!-- ── FOOTER  ─────────────── -->
<footer id="site-footer">
  <div id="footer-inner">
    <!-- Créditos -->
    <div id="footer-credits">
      <p class="footer-credit-main">© 2026 · Encomienda de Predicción Estacional</p>
      <p class="footer-credit-sub">AEMET – Tragsatec · 2024–2026</p>
    </div>
  </div>
</footer>

<style>
/* ── Oculta el footer por defecto de Quarto si quedase ── */
.nav-footer, #quarto-footer { display: none !important; }

#site-footer {
  background: #0072bc;
  color: white;
  font-family: 'IBM Plex Sans', Arial, sans-serif;
  padding: 1.2rem 1.5rem 1rem;
  margin-top: 4rem;
  box-sizing: border-box;

  /* fuerza al footer a empezar en el borde izquierdo del viewport */
  position: relative;
  left: 0;
  right: 0;
  width: 100%;
  margin-left: calc(-1 * (100vw - 100%) / 2);
  margin-right: calc(-1 * (100vw - 100%) / 2);

  display: flex;
  flex-direction: column;
  align-items: center;
}

#footer-inner {
  width: 100%;
  max-width: 1100px;
}

/* evita la barra horizontal residual */
html, body { overflow-x: hidden; }

/* ── Créditos ── */
#footer-credits {
  text-align: center;
}
.footer-credit-main {
  margin: 0;
  font-size: 0.88rem;
  font-weight: 600;
  color: white;
}
.footer-credit-sub {
  margin: 0.25rem 0 0 0;
  font-size: 0.8rem;
  color: rgba(255,255,255,0.8);
}

@media (max-width: 768px) {
  #site-footer { padding: 1.8rem 1rem 1.5rem; }
}
</style>

<script>
  // Mueve el footer fuera del contenedor de Quarto, justo antes de cerrar el body
  document.addEventListener('DOMContentLoaded', function() {
    const footer = document.getElementById('site-footer');
    if (footer && footer.parentElement !== document.body) {
      document.body.appendChild(footer);
    }
  });
</script>
